<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LogiPulse — Global Freight Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0 !important
    }

    :root {
      --bg: #f4f1e9;
      --card: #fbfaf6;
      --ink: #15161c;
      --mut: #6b6d78;
      --rule: #d6d0c0;
      --ac: #2d3cb5;
      --ac2: #0f7b86;
      --ok: #2f7d4f;
      --warn: #b7791f;
      --bad: #b3322d
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 Inter, system-ui, sans-serif
    }

    h1,
    h2,
    h3 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      letter-spacing: -.015em;
      margin: 0
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.08
    }

    h2 {
      font-size: 1.6rem
    }

    h3 {
      font-size: 1.15rem
    }

    .mono,
    pre,
    td.m {
      font-family: 'IBM Plex Mono', ui-monospace, monospace
    }

    a {
      color: inherit
    }

    .mut {
      color: var(--mut)
    }

    .kick {
      font: 500 11px 'IBM Plex Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ac);
      margin-bottom: .6rem
    }

    header.top {
      border-bottom: 1.5px solid var(--ink);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5
    }

    .mast {
      max-width: 1120px;
      margin: 0 auto;
      padding: .9rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.75rem;
      align-items: center
    }

    .brand {
      font: 600 1.35rem Fraunces, Georgia, serif;
      text-decoration: none;
      margin-right: auto
    }

    .brand small {
      font: 400 .8rem Inter;
      color: var(--mut);
      margin-left: .5rem
    }

    nav {
      display: flex;
      gap: 1.4rem;
      flex-wrap: wrap
    }

    nav a {
      text-decoration: none;
      font-size: .85rem;
      padding: .2rem 0;
      border-bottom: 2px solid transparent
    }

    nav a:hover,
    nav a.on {
      border-color: var(--ac)
    }

    select,
    input,
    textarea {
      font: inherit;
      font-size: .85rem;
      background: var(--card);
      border: 1px solid var(--ink);
      padding: .5rem .65rem;
      color: var(--ink);
      width: 100%
    }

    select#cur {
      width: auto
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--ac);
      outline-offset: 1px
    }

    label {
      display: block;
      font-size: .72rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: .9rem 0 .3rem
    }

    .btn {
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      padding: .6rem 1.1rem;
      font: 500 .85rem Inter;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: .15s
    }

    .btn:hover {
      background: var(--ac);
      border-color: var(--ac)
    }

    .btn.o {
      background: transparent;
      color: var(--ink)
    }

    .btn.o:hover {
      background: var(--ink);
      color: var(--bg)
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem
    }

    .rule {
      border: 0;
      border-top: 1px solid var(--ink);
      margin: 2.5rem 0 1.5rem
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--rule);
      margin: 2.2rem 0
    }

    .stats div {
      padding: 1rem 1rem 1rem 0
    }

    .stats b {
      display: block;
      font: 500 2rem Fraunces, serif
    }

    .stats span {
      font-size: .75rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem
    }

    .g3 p {
      margin: .4rem 0 0;
      color: var(--mut);
      font-size: .92rem
    }

    .num {
      font: 500 .8rem 'IBM Plex Mono';
      color: var(--ac)
    }

    .cols {
      display: grid;
      grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
      gap: 2rem;
      align-items: start
    }

    @media(max-width:820px) {
      .cols {
        grid-template-columns: 1fr !important
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem
    }

    th {
      text-align: left;
      font: 500 10.5px 'IBM Plex Mono';
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--mut);
      padding: .5rem .6rem;
      border-bottom: 1.5px solid var(--ink)
    }

    td {
      padding: .6rem;
      border-bottom: 1px solid var(--rule)
    }

    tr.row {
      cursor: pointer
    }

    tr.row:hover td {
      background: #ece8db
    }

    tr.row.sel td {
      background: #e4e6f7
    }

    .tag {
      font: 500 10.5px 'IBM Plex Mono';
      text-transform: uppercase;
      letter-spacing: .06em;
      border: 1px solid currentColor;
      padding: .1rem .4rem;
      white-space: nowrap
    }

    .s0 {
      color: var(--ac2)
    }

    .s1 {
      color: var(--warn)
    }

    .s2 {
      color: var(--ok)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--ink);
      padding: 1.25rem
    }

    .scroll {
      overflow-x: auto
    }

    .tl {
      display: flex;
      min-width: 480px;
      margin: 1.6rem 0 1rem
    }

    .step {
      flex: 1;
      position: relative;
      text-align: center;
      font-size: 11px;
      color: var(--mut)
    }

    .step i {
      display: block;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--ink);
      background: var(--bg);
      margin: 0 auto 8px;
      position: relative;
      z-index: 1
    }

    .step:not(:last-child):after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      width: 100%;
      height: 1.5px;
      background: var(--rule)
    }

    .step.done:not(:last-child):after {
      background: var(--ink)
    }

    .step.done i {
      background: var(--ink)
    }

    .step.cur i {
      background: var(--ac);
      border-color: var(--ac);
      animation: p 1.6s infinite
    }

    .step.cur {
      color: var(--ink);
      font-weight: 600
    }

    @keyframes p {
      0% {
        box-shadow: 0 0 0 0 #2d3cb566
      }

      100% {
        box-shadow: 0 0 0 10px #2d3cb500
      }
    }

    .bar {
      height: 6px;
      background: var(--rule)
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac);
      transition: width .6s
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem
    }

    .ports {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      border-top: 1.5px solid var(--ink);
      border-left: 1px solid var(--rule)
    }

    .port {
      padding: 1.1rem;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      transition: .2s
    }

    .port:hover {
      background: var(--card)
    }

    .port b {
      font: 500 2rem Fraunces, serif;
      display: block
    }

    .err {
      color: var(--bad);
      font-size: .78rem;
      margin-top: .35rem
    }

    pre {
      background: var(--card);
      border: 1px solid var(--ink);
      padding: 1rem;
      font-size: 12px;
      line-height: 1.55;
      overflow-x: auto;
      margin: .5rem 0 1rem
    }

    .k {
      color: #2d3cb5
    }

    .s {
      color: #0f7b86
    }

    .c {
      color: #8a8c96
    }

    .n {
      color: #b7791f
    }

    .f {
      color: #8a3fb5
    }

    .tabs {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin: 1.2rem 0
    }

    .tabs button {
      background: none;
      border: 1px solid var(--ink);
      padding: .4rem .8rem;
      font: inherit;
      font-size: .8rem;
      cursor: pointer;
      color: var(--ink)
    }

    .tabs button.on {
      background: var(--ink);
      color: var(--bg)
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px
    }

    .fade {
      animation: f .35s both
    }

    @keyframes f {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1
      }
    }

    footer {
      border-top: 1.5px solid var(--ink);
      padding: 1.2rem;
      text-align: center;
      font-size: .75rem;
      color: var(--mut)
    }

    /* ===== Responsive layer ===== */
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth
    }

    img,
    svg {
      max-width: 100%
    }

    td,
    th {
      overflow-wrap: anywhere
    }

    td.m {
      overflow-wrap: normal;
      word-break: break-all
    }

    .mast,
    .wrap {
      padding-left: max(1.25rem, env(safe-area-inset-left));
      padding-right: max(1.25rem, env(safe-area-inset-right))
    }

    footer {
      padding-bottom: max(1.2rem, env(safe-area-inset-bottom))
    }

    .grid2 {
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr))
    }

    .ports {
      grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr))
    }

    .card {
      scroll-margin-top: 90px
    }

    h2 {
      font-size: clamp(1.3rem, 3vw, 1.6rem)
    }

    /* large desktops & ultrawide */
    @media(min-width:1600px) {
      html {
        font-size: 17px
      }

      .mast,
      .wrap {
        max-width: 1360px
      }
    }

    @media(min-width:2200px) {
      html {
        font-size: 20px
      }

      .mast,
      .wrap {
        max-width: 1680px
      }
    }

    /* tablets & large phones */
    @media(max-width:1024px) {
      .wrap {
        padding-top: 2rem
      }

      .cols {
        gap: 1.5rem
      }
    }

    @media(max-width:700px) {
      .mast {
        gap: .6rem 1rem;
        padding-top: .7rem;
        padding-bottom: .7rem
      }

      nav {
        order: 3;
        width: 100%;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 1.3rem;
        border-top: 1px solid var(--rule);
        padding-top: .3rem;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch
      }

      nav::-webkit-scrollbar {
        display: none
      }

      nav a {
        white-space: nowrap;
        padding: .45rem 0
      }

      .wrap {
        padding-top: 1.6rem;
        padding-bottom: 3rem
      }

      .stats b {
        font-size: 1.6rem
      }

      td,
      th {
        padding: .5rem .4rem
      }
    }

    /* vertical timeline on phones */
    @media(max-width:600px) {
      .tl {
        flex-direction: column;
        min-width: 0;
        margin: 1.2rem 0
      }

      .step {
        display: flex;
        align-items: flex-start;
        text-align: left;
        min-height: 42px;
        font-size: 13px
      }

      .step i {
        margin: 0 .75rem 0 0;
        flex: none
      }

      .step:not(:last-child):after {
        left: 7px;
        top: 16px;
        width: 1.5px;
        height: calc(100% - 16px)
      }
    }

    /* small phones */
    @media(max-width:480px) {
      .brand small {
        display: none
      }

      .stats {
        grid-template-columns: 1fr 1fr
      }

      .card {
        padding: 1rem
      }

      h1 {
        font-size: 2rem
      }

      .tabs button {
        flex: 1 1 auto
      }

      .btn {
        width: 100%;
        text-align: center;
        margin-bottom: .5rem
      }
    }

    @media(max-width:340px) {

      .mast,
      .wrap {
        padding-left: .8rem;
        padding-right: .8rem
      }

      .stats b {
        font-size: 1.35rem
      }

      nav {
        gap: .9rem
      }
    }

    /* touch devices: bigger targets, no iOS zoom-on-focus, no sticky hover */
    @media(pointer:coarse) {

      .btn,
      select,
      input,
      textarea,
      .tabs button {
        min-height: 44px
      }

      input,
      select,
      textarea {
        font-size: 16px
      }

      nav a {
        min-height: 44px;
        display: inline-flex;
        align-items: center
      }
    }

    @media(hover:none) {
      tr.row:hover td {
        background: none
      }

      .port:hover {
        background: none
      }

      .btn:hover {
        background: var(--ink);
        border-color: var(--ink)
      }

      .btn.o:hover {
        background: transparent;
        color: var(--ink)
      }
    }

    /* landscape phones: reclaim vertical space */
    @media(max-height:480px) and (orientation:landscape) {
      header.top {
        position: static
      }

      .wrap {
        padding-top: 1.2rem
      }
    }

    /* accessibility & print */
    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    @media print {

      header.top,
      footer,
      .tabs,
      .btn,
      nav {
        display: none
      }

      body {
        background: #fff
      }

      .card {
        border-color: #999
      }
    }

    /* ===== New visual pages ===== */
    .chart {
      background: var(--card);
      border: 1px solid var(--ink);
      padding: .6rem
    }

    .chart svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 720px
    }

    .grat {
      stroke: var(--rule);
      stroke-width: 1;
      fill: none
    }

    .glab {
      font: 10px 'IBM Plex Mono', monospace;
      fill: var(--mut)
    }

    .lane {
      fill: none;
      stroke: var(--ac);
      stroke-dasharray: 7 5;
      animation: flow 1.6s linear infinite;
      opacity: .55;
      cursor: pointer
    }

    .lane.on,
    .lane:hover {
      opacity: 1;
      stroke: var(--ink)
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -24
      }
    }

    @keyframes blink {
      50% {
        opacity: .35
      }
    }

    .pt {
      fill: var(--ink)
    }

    .ptl {
      font: 500 11px 'IBM Plex Mono', monospace;
      fill: var(--ink)
    }

    .cont {
      fill: var(--ac2);
      stroke: var(--bg);
      stroke-width: 2;
      animation: blink 1.8s infinite
    }

    .board {
      background: var(--ink);
      color: #f4f1e9;
      padding: .4rem 1rem 1rem;
      border: 1px solid var(--ink)
    }

    .board table {
      font: 500 12.5px 'IBM Plex Mono', monospace;
      min-width: 560px
    }

    .board th {
      color: #9aa0c8;
      border-color: #3a3d52
    }

    .board td {
      border-color: #2b2e40;
      color: #f4f1e9
    }

    .board .amber {
      color: #ffc857
    }

    .board .bd-in {
      color: #7fe0c5
    }

    .board .bd-out {
      color: #ffc857
    }

    .hbar {
      height: 10px;
      background: var(--rule)
    }

    .hbar i {
      display: block;
      height: 100%;
      background: var(--ac)
    }

    .cl {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 1.3fr) minmax(0, 2fr) auto;
      gap: 1rem;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule)
    }

    details {
      margin: 1.4rem 0
    }

    summary {
      cursor: pointer;
      font: 500 11px 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--ac)
    }

    @media(max-width:700px) {
      .cl {
        grid-template-columns: 1.6rem minmax(0, 1fr)
      }

      .cl>:nth-child(3),
      .cl>:nth-child(4) {
        grid-column: 1/-1
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="mast">
      <a class="brand" href="#/">LogiPulse<small>Global Freight Engine</small></a>
      <nav id="nav"></nav>
      <select id="cur" aria-label="Currency"></select>
    </div>
  </header>
  <div id="app"></div>
  <footer id="foot"></footer>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    /* ===== Database access: every request goes to /api/* (Vercel functions). No keys exist in this file or in the browser. ===== */
    try { localStorage.removeItem('lp_cfg') } catch (e) { }   // wipes any key saved by the old Connect tab
    let sb = null, _t = 0, _p = null;
    const TBL = { ports: 'ports', shipments: 'shipments', shipment_legs: 'legs', cargo_items: 'cargo' };
    const API = {
      snap() { if (Date.now() - _t > 1500) { _t = Date.now(); _p = fetch('/api/data').then(async r => { if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error(j.error || 'API error ' + r.status); e.status = r.status; throw e } return r.json() }) } return _p },
      from(t) { const q = { select: () => q, order: () => q, then: (ok, no) => API.snap().then(d => ({ data: d[TBL[t]], error: null })).then(ok, no) }; return q },
      async rpc(fn, args) { try { const r = await fetch('/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn, args }) }); const j = await r.json().catch(() => ({})); return r.ok ? { data: j.data, error: null } : { data: null, error: { message: j.error || 'Request failed' } } } catch (e) { return { data: null, error: { message: e.message } } } }
    };

    /* ===== State & helpers ===== */
    const RATES0 = { USD: 1, EUR: .92, INR: 83.4, GBP: .79, JPY: 151.2 };
    const CATS = { General: .0009, Electronics: .0014, Chemicals: .0022, Perishables: .0018, Machinery: .0012 };
    const STAGES = ['Departure', 'Customs', 'Sea transit', 'Transit hub', 'Delivery'];
    const S = { ports: [], ships: [], cur: 'USD', rates: { ...RATES0 }, fx: 'fallback', weather: {}, wxLive: false, sel: null, f: 'All', q: '', tab: 'schema', qOut: '', qSql: '', rad: 500, log: [], err: '' };
    const fmt = u => new Intl.NumberFormat('en-US', { style: 'currency', currency: S.cur, maximumFractionDigits: ['JPY', 'INR'].includes(S.cur) ? 0 : 2 }).format(u * S.rates[S.cur]);
    const hav = (a, b, c, d) => { const t = x => x * Math.PI / 180, R = 6371, h = Math.sin(t(c - a) / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(t(d - b) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)) };
    const port = c => S.ports.find(p => p.port_code === c) || { name: c, lat: 0, lon: 0 };
    const dist = (o, d) => Math.round(hav(port(o).lat, port(o).lon, port(d).lat, port(d).lon));
    const sc = s => s === 'In Transit' ? 's0' : s === 'Customs Hold' ? 's1' : 's2';
    const logSql = (label, sql) => { S.log.unshift({ t: new Date().toLocaleTimeString(), label, sql, src: sb ? 'supabase' : 'demo' }); S.log = S.log.slice(0, 30) };
    const KW = 'CREATE|TABLE|PRIMARY|KEY|REFERENCES|NOT|NULL|DEFAULT|UNIQUE|CHECK|INDEX|USING|GIST|GIN|ON|SELECT|FROM|JOIN|WHERE|AND|GROUP|BY|ORDER|INSERT|INTO|VALUES|UPDATE|SET|FUNCTION|RETURNS|TRIGGER|AFTER|FOR|EACH|ROW|EXECUTE|BEGIN|END|RETURN|LANGUAGE|OVER|DESC|AS|COALESCE|SUM|AVG|COUNT|RANK|ILIKE|IN|IS|TRUE|ENABLE|POLICY|TO|CASCADE|DECLARE|IF|THEN|ELSE';
    const HRE = new RegExp(`(--[^\\n]*)|('[^']*')|\\b(${KW})\\b|\\b(ST_\\w+)\\b|\\b(\\d+(?:\\.\\d+)?)\\b`, 'gi');
    const hl = q => esc(q).replace(HRE, (m, c, s, k, f, n) => c ? `<span class="c">${c}</span>` : s ? `<span class="s">${s}</span>` : k ? `<span class="k">${k}</span>` : f ? `<span class="f">${f}</span>` : `<span class="n">${n}</span>`);

    /* ===== Data layer (Supabase or demo) ===== */

end $$ language plpgsql;

          if (sb) { const { data, error } = await sb.rpc('ports_within', { p_lat: s.cur_lat, p_lon: s.cur_lon, p_radius_km: S.rad }); if (error) throw error; rows = data.map(r => [`${r.port_code} · ${esc(r.name)}`, Number(r.dist_km).toLocaleString() + ' km']) }
          else rows = S.ports.map(p => [p, hav(s.cur_lat, s.cur_lon, p.lat, p.lon)]).filter(r => r[1] <= S.rad).sort((a, b) => a[1] - b[1]).map(r => [`${r[0].port_code} · ${esc(r[0].name)}`, Math.round(r[1]).toLocaleString() + ' km'])
        }
        if (k === 'run') {
          S.qSql = `select s.tracking_code, o.port_code as origin, s.base_cost_usd,\n  sum(s.total_weight_kg) over (partition by o.port_code order by s.created_at, s.id) as running_kg,\n  lag(s.base_cost_usd) over (order by s.created_at, s.id) as prev_cost,\n  ntile(4) over (order by s.base_cost_usd) as cost_quartile,\n  percent_rank() over (order by s.base_cost_usd) as pct_rank\nfrom shipments s\njoin shipment_legs l on l.shipment_id = s.id and l.leg_order = 1\njoin ports o on o.id = l.origin_port_id\norder by s.created_at, s.id;`; head = ['Tracking', 'Origin', 'Cost', 'Running kg', 'Prev cost', 'Quartile', 'Pct rank'];
          if (sb) rows = (await liveRpc('shipment_analytics')).map(r => [r.tracking_code, r.origin, fmt(r.base_cost_usd), Number(r.running_kg).toLocaleString(), r.prev_cost == null ? '—' : fmt(r.prev_cost), 'Q' + r.cost_quartile, r.pct_rank + '%']);
          else {
            const A = [...S.ships].sort((a, b) => a.id - b.id), by = [...A].sort((a, b) => a.base_cost_usd - b.base_cost_usd), run = {};
            rows = A.map((x, i) => { run[x.o] = (run[x.o] || 0) + +x.total_weight_kg; const r = by.indexOf(x); return [x.tracking_code, x.o, fmt(x.base_cost_usd), run[x.o].toLocaleString(), i ? fmt(A[i - 1].base_cost_usd) : '—', 'Q' + (Math.floor(r * 4 / A.length) + 1), Math.round(r / Math.max(1, A.length - 1) * 100) + '%'] })
          }
        }
        if (k === 'mv') {
          S.qSql = `refresh materialized view mv_port_stats;\nselect * from mv_port_stats order by total_kg desc;\n-- totals are precomputed; refresh on demand instead of re-aggregating per request`; head = ['Port', 'Shipments', 'Total kg', 'Declared value'];
          if (sb) rows = (await liveRpc('port_stats', { p_refresh: true })).map(r => [`${r.port_code} · ${esc(r.name)}`, r.shipments, Number(r.total_kg).toLocaleString(), fmt(r.total_value)]);
          else {
            const m = {}; S.ships.forEach(x => [x.o, x.d].forEach(p => { const e = m[p] = m[p] || { n: new Set(), kg: 0, v: 0 }; e.n.add(x.id); e.kg += +x.total_weight_kg; e.v += x.cargo.reduce((a, c) => a + +c.declared_value, 0) }));
            rows = Object.entries(m).sort((a, b) => b[1].kg - a[1].kg).map(([p, e]) => [`${p} · ${esc(port(p).name)}`, e.n.size, e.kg.toLocaleString(), fmt(e.v)])

        }
        if (k === 'evt') {

          if (sb) rows = (await liveRpc('shipment_timeline', { p_id: s.id })).map(r => [new Date(r.created_at).toLocaleString(), `${r.from_status || '—'} / ${r.from_stage == null ? '—' : STAGES[r.from_stage]}`, `${r.to_status} / ${STAGES[r.to_stage]}`, esc(r.note || '')]);
          else rows = (DEMO.ev[s.id] || [{ t: 'seed', from: '—', to: st(s), note: 'Shipment created' }]).map(e => [e.t, e.from, e.to, esc(e.note)])

          if (sb) rows = (await liveRpc('audit_recent', { p_limit: 20 })).map(r => [new Date(r.changed_at).toLocaleString(), r.op, r.row_id, r.op === 'UPDATE' ? `${r.old_row.status} → ${r.new_row.status} (stage ${r.new_row.stage})` : r.op === 'INSERT' ? 'row inserted' : 'row deleted']);
          else rows = DEMO.audit.map(a => [a.t, a.op, a.id, esc(a.chg)])
        }
        if (k === 'fts') {
          const term = $('#fts').value.trim(); S.term = term; if (!term) throw new Error('Type a search term first, for example shanghai or chemie.'); const tq = term.replace(/'/g, "''");
          S.qSql = `select tracking_code, sender, receiver,\n  ts_rank(search, websearch_to_tsquery('simple', '${tq}')) as rank\nfrom shipments\nwhere search @@ websearch_to_tsquery('simple', '${tq}')\norder by rank desc;  -- GIN index on a generated tsvector column`; head = ['Tracking', 'Sender', 'Receiver'];
          if (sb) rows = (await liveRpc('search_shipments', { p_q: term })).map(r => [r.tracking_code, esc(r.sender), esc(r.receiver)]);
          else rows = S.ships.filter(x => (x.tracking_code + ' ' + x.sender + ' ' + x.receiver).toLowerCase().includes(term.toLowerCase())).map(r => [r.tracking_code, esc(r.sender), esc(r.receiver)])
        }
        if (k === 'exp') {
          const kind = $('#expk').value; S.expk = kind; S.qSql = `explain (analyze, timing off)\n${EXPQ[kind]};\n-- seq scans are disabled for this demo so the index shows up`; head = ['QUERY PLAN'];
          if (!sb) throw new Error('EXPLAIN needs the live database. Connect Supabase to run this one.');
          rows = (await liveRpc('explain_demo', { p_kind: kind })).map(r => [`<span class="mono">${esc(r)}</span>`])
        }
        S.qOut = tbl(head, rows); logSql('Analytics · ' + k, S.qSql);
      } catch (e) { S.qOut = `<div class="err">${esc(e.message || e)}</div>` }

    }

    /* ===== Events ===== */
    const BIND = {
      shipments() {
        document.querySelectorAll('tr.row').forEach(r => r.onclick = () => {
          S.sel = +r.dataset.id; const s = S.ships.find(x => x.id === S.sel);
          logSql('Select shipment', `select s.*, l.leg_order, l.distance_km, o.port_code, d.port_code\nfrom shipments s\njoin shipment_legs l on l.shipment_id = s.id\njoin ports o on o.id = l.origin_port_id\njoin ports d on d.id = l.dest_port_id\nwhere s.tracking_code = '${s.tracking_code}';`); render(); if (innerWidth <= 820) $('.card').scrollIntoView({ behavior: 'smooth', block: 'start' })
        });

        $('#q').oninput = e => { S.q = e.target.value; render(); const i = $('#q'); i.focus(); i.setSelectionRange(S.q.length, S.q.length) };
        $('#f').onchange = e => { S.f = e.target.value; logSql('Filter by status', `select * from shipments${S.f === 'All' ? '' : `\nwhere status = '${S.f}'`}\norder by id desc;`); render() };
      },
      new() {

          $('#est').textContent = u ? fmt(u) : '—'; $('#estSub').textContent = o === d ? 'Origin and destination must differ' : `${dist(o, d).toLocaleString()} km · 1 USD = ${S.rates[S.cur].toLocaleString()} ${S.cur} (${S.fx})`;
          const n = Math.ceil(w / 26000) || 0, p = Math.round((w % 26000 || 26000) / 26000 * 100); $('#fit').textContent = w > 0 ? `${n} × 40ft (last ${p}% full)` : '—'; $('#fitBar').style.width = (w > 0 ? p : 0) + '%'; return u
        };

        $('#go').onclick = async () => {
          $('#jErr').textContent = ''; let meta;
          try { meta = JSON.parse($('#fJ').value); if (!meta || typeof meta !== 'object' || Array.isArray(meta)) throw 0 } catch (e) { return $('#jErr').textContent = 'Invalid JSON — check quotes, commas and braces.' }

          if (o === d) return $('#jErr').textContent = 'Origin and destination must be different ports.';

          if (sb) {
            const { data, error } = await sb.rpc('create_shipment', { p_sender: sender, p_receiver: recv, p_origin: o, p_dest: d, p_category: cat, p_weight: w, p_metadata: meta, p_base_cost: u });
            if (error) return $('#jErr').textContent = error.message; S.sel = data.id; await load()
          }
          else { const id = Math.max(0, ...S.ships.map(x => x.id)) + 1; S.ships.unshift(mkShip(id, o, d, 'In Transit', 0, [port(o).lat, port(o).lon], sender, recv, u, { ...meta, category: cat }, [{ hs_code: meta.hs_code || '0000.00', weight_kg: w, declared_value: +meta.declared_value || 0 }])); S.sel = id; demoLog(S.ships[0], 'INSERT', 'Shipment created') }
          S.q = ''; S.f = 'All'; location.hash = '#/shipments'
        };
      },
      database() {
        document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render() });
        document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => runQ(b.dataset.q));
        if ($('#rad')) $('#rad').value = S.rad; if ($('#expk')) $('#expk').value = S.expk || 'spatial';
      }
    };
    /* ===== Visual pages: each one is backed by a SQL join ===== */
    const SQL_LANES = `select o.port_code as origin, d.port_code as dest,\n  count(*) as shipments, sum(s.total_weight_kg) as total_kg,\n  round(avg(s.base_cost_usd), 2) as avg_cost,\n  count(*) filter (where s.status = 'Customs Hold') as on_hold\nfrom shipment_legs l\njoin shipments s on s.id = l.shipment_id\njoin ports o on o.id = l.origin_port_id\njoin ports d on d.id = l.dest_port_id\ngroup by o.id, d.id\norder by shipments desc;`;
    const SQL_MF = c => `select case when l.origin_port_id = p.id then 'Outbound' else 'Inbound' end as direction,\n  s.tracking_code, s.status, c.hs_code, c.weight_kg, c.declared_value\nfrom ports p\njoin shipment_legs l on p.id in (l.origin_port_id, l.dest_port_id)\njoin shipments s on s.id = l.shipment_id\njoin cargo_items c on c.leg_id = l.id\nwhere p.port_code = '${c}'\norder by direction desc, s.tracking_code;`;
    const SQL_CL = `select s.sender, count(distinct s.id) as shipments,\n  sum(c.weight_kg) as total_kg,\n  sum(c.declared_value) as total_value,\n  sum(c.declared_value * c.duty_rate) as total_duty\nfrom shipments s\njoin shipment_legs l on l.shipment_id = s.id\njoin cargo_items c on c.leg_id = l.id\ngroup by s.sender\norder by total_value desc;`;
    const sqlBox = q => `<details><summary>How this page gets its data · SQL join</summary><pre>${hl(q)}</pre></details>`;
    const loading = (k, t) => `<section class="wrap"><div class="kick">${k}</div><h1>${t}</h1><p class="mut" style="margin-top:1rem">Loading from the database…</p></section>`;

    async function getLanes() {
      logSql('Map · lane summary', SQL_LANES);
      if (sb) return liveRpc('lane_summary');
      const m = {}; S.ships.forEach(x => { const e = m[x.o + x.d] = m[x.o + x.d] || { origin: x.o, dest: x.d, shipments: 0, total_kg: 0, cost: 0, on_hold: 0 }; e.shipments++; e.total_kg += +x.total_weight_kg; e.cost += +x.base_cost_usd; if (x.status === 'Customs Hold') e.on_hold++ });
      return Object.values(m).map(e => ({ origin: e.origin, origin_name: port(e.origin).name, o_lat: port(e.origin).lat, o_lon: port(e.origin).lon, dest: e.dest, dest_name: port(e.dest).name, d_lat: port(e.dest).lat, d_lon: port(e.dest).lon, shipments: e.shipments, total_kg: e.total_kg, avg_cost: e.cost / e.shipments, on_hold: e.on_hold })).sort((a, b) => b.shipments - a.shipments);
    }
    async function getManifest(c) {
      logSql('Port desk · ' + c, SQL_MF(c));
      if (sb) return liveRpc('port_manifest', { p_code: c });
      const rows = []; S.ships.forEach(x => { if (x.o !== c && x.d !== c) return; x.cargo.forEach(i => rows.push({ direction: x.o === c ? 'Outbound' : 'Inbound', tracking_code: x.tracking_code, status: x.status, counterpart: x.o === c ? x.d : x.o, hs_code: i.hs_code, weight_kg: +i.weight_kg, declared_value: +i.declared_value })) });
      return rows.sort((a, b) => b.direction.localeCompare(a.direction) || a.tracking_code.localeCompare(b.tracking_code));
    }
    async function getClients() {
      logSql('Clients · ledger', SQL_CL);
      if (sb) return liveRpc('client_ledger');
      const m = {}; S.ships.forEach(x => { const e = m[x.sender] = m[x.sender] || { sender: x.sender, shipments: 0, total_kg: 0, total_value: 0, total_duty: 0, last_status: x.status }; e.shipments++; x.cargo.forEach(i => { e.total_kg += +i.weight_kg; e.total_value += +i.declared_value; e.total_duty += +i.declared_value * .06 }) });
      return Object.values(m).sort((a, b) => b.total_value - a.total_value);
    }
    async function need(key, fn, tag, ok) {
      tag = tag || key; if ((S[key] != null && (!ok || ok(S[key]))) || S._busy === tag) return;
      S._busy = tag;
      try { S[key] = await fn() } catch (e) { S.err = 'Could not load data: ' + (e.message || e); S[key] = ok ? { code: S.dk, rows: [] } : [] }
      S._busy = null; render();
    }

    const MX = lon => (lon + 180) / 360 * 1000, MY = lat => (72 - lat) * 2.7778;
    function arc(e) {
      const dl = e.d_lon - e.o_lon; let dx = e.d_lon, sh = 0; if (dl > 180) { dx -= 360; sh = 1000 } else if (dl < -180) { dx += 360; sh = -1000 }
      const x1 = MX(e.o_lon), y1 = MY(e.o_lat), x2 = MX(dx), y2 = MY(e.d_lat), h = Math.hypot(x2 - x1, y2 - y1) * .2;
      return { sh, d: `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${((x1 + x2) / 2).toFixed(1)} ${((y1 + y2) / 2 - h).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}` }
    }

    PAGES.map = () => {
      if (!S.lanes) return loading('Chart', 'Trade lanes');
      const L = S.lanes, sel = Math.min(S.lane || 0, Math.max(0, L.length - 1)), ends = new Set(L.flatMap(e => [e.origin, e.dest]));
      const grid = [...Array(13)].map((_, i) => `<line class="grat" x1="${(i * 83.33).toFixed(1)}" y1="0" x2="${(i * 83.33).toFixed(1)}" y2="312"/><text class="glab" x="${(i * 83.33 + 3).toFixed(1)}" y="306">${i * 30 - 180}°</text>`).join('') + [60, 40, 20, 0, -20, -40].map(a => `<line class="grat" x1="0" y1="${MY(a).toFixed(1)}" x2="1000" y2="${MY(a).toFixed(1)}"/><text class="glab" x="4" y="${(MY(a) - 3).toFixed(1)}">${a}°</text>`).join('');

  <p class="mut" style="max-width:60ch;margin:1rem 0 1.5rem">Every dashed line is a lane built by joining shipments, legs and both ports. Thicker means more shipments. Green squares are containers at their last reported position.</p>

  ${e ? `<div class="stats"><div><b>${e.origin} → ${e.dest}</b><span>${esc(e.origin_name)} to ${esc(e.dest_name)}</span></div><div><b>${e.shipments}</b><span>Shipments</span></div><div><b>${(+e.total_kg / 1000).toFixed(1)} t</b><span>Cargo</span></div><div><b>${fmt(e.avg_cost)}</b><span>Average quote</span></div><div><b>${e.on_hold || 0}</b><span>Customs holds</span></div></div>` : ''}
  <div class="scroll"><table><tr><th>Lane</th><th>Ships</th><th>Tonnes</th><th>Avg quote</th><th>Holds</th></tr>${L.map((x, i) => `<tr class="row ${i === sel ? 'sel' : ''}" data-lane="${i}"><td>${x.origin} → ${x.dest}<br><span class="mut" style="font-size:.75rem">${esc(x.origin_name)} to ${esc(x.dest_name)}</span></td><td>${x.shipments}</td><td>${(+x.total_kg / 1000).toFixed(1)}</td><td>${fmt(x.avg_cost)}</td><td>${x.on_hold || '—'}</td></tr>`).join('')}</table></div>
  ${sqlBox(SQL_LANES)}</section>`
    };

    PAGES.desk = () => {
      if (!S.ports.find(p => p.port_code === S.dk)) S.dk = (S.ports.find(p => p.port_code === 'RTM') || S.ports[0] || {}).port_code;

      const R = S.mf.rows, kg = d => R.filter(r => r.direction === d).reduce((a, r) => a + +r.weight_kg, 0), hs = {};
      R.forEach(r => hs[r.hs_code] = (hs[r.hs_code] || 0) + +r.weight_kg); const hm = Math.max(1, ...Object.values(hs));
      return `<section class="wrap fade">${top}
  <div class="board scroll"><table><tr><th>Dir</th><th>Tracking</th><th>Via</th><th>Status</th><th>HS</th><th>Kg</th><th>Value</th></tr>${R.map(r => `<tr><td class="${r.direction === 'Inbound' ? 'bd-in' : 'bd-out'}">${r.direction === 'Inbound' ? '▼ IN' : '▲ OUT'}</td><td>${r.tracking_code}</td><td>${r.counterpart}</td><td class="amber">${String(r.status).toUpperCase()}</td><td>${r.hs_code}</td><td>${(+r.weight_kg).toLocaleString()}</td><td>${fmt(r.declared_value)}</td></tr>`).join('') || '<tr><td colspan="7">No cargo has touched this port yet.</td></tr>'}</table></div>
  <div class="stats"><div><b>${(kg('Inbound') / 1000).toFixed(1)} t</b><span>Inbound</span></div><div><b>${(kg('Outbound') / 1000).toFixed(1)} t</b><span>Outbound</span></div><div><b>${R.length}</b><span>Cargo lines</span></div></div>
  ${Object.keys(hs).length ? `<h2 style="margin-bottom:1rem">Weight by HS code</h2>${Object.entries(hs).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div style="display:grid;grid-template-columns:5.5rem 1fr 6rem;gap:.8rem;align-items:center;margin:.5rem 0"><span class="mono" style="font-size:.8rem">${k}</span><div class="hbar"><i style="width:${(v / hm * 100).toFixed(0)}%"></i></div><span class="mut" style="font-size:.8rem;text-align:right">${v.toLocaleString()} kg</span></div>`).join('')}` : ''}
  ${sqlBox(SQL_MF(S.dk))}</section>`
    };

    PAGES.clients = () => {
      if (!S.clients) return loading('Ledger', 'Clients');
      const C = S.clients, max = Math.max(1, ...C.map(c => +c.total_value)), tv = C.reduce((a, c) => a + +c.total_value, 0), td = C.reduce((a, c) => a + +c.total_duty, 0);
      return `<section class="wrap fade"><div class="kick">Ledger</div><h1>Clients</h1>
  <p class="mut" style="max-width:60ch;margin:1rem 0 0">Who ships the most, joined across shipments, legs and cargo lines. Bars show declared value relative to the biggest client.</p>
  <div class="stats"><div><b>${C.length}</b><span>Clients</span></div><div><b>${fmt(tv)}</b><span>Declared value</span></div><div><b>${fmt(td)}</b><span>Duty owed</span></div></div>
  ${C.map((c, i) => `<div class="cl"><span class="num">${String(i + 1).padStart(2, '0')}</span><div><h3>${esc(c.sender)}</h3><div class="mut" style="font-size:.78rem">${c.shipments} shipment${c.shipments == 1 ? '' : 's'} · ${(+c.total_kg / 1000).toFixed(1)} t</div></div><div><div class="hbar"><i style="width:${(c.total_value / max * 100).toFixed(0)}%"></i></div><div class="mut" style="font-size:.72rem;margin-top:.3rem">Declared ${fmt(c.total_value)} · duty ${fmt(c.total_duty)}</div></div><span class="tag ${sc(c.last_status)}">${c.last_status}</span></div>`).join('') || '<p class="mut">No clients yet.</p>'}
  ${sqlBox(SQL_CL)}</section>`
    };

    BIND.map = () => { need('lanes', getLanes); document.querySelectorAll('[data-lane]').forEach(n => n.onclick = () => { S.lane = +n.dataset.lane; render() }) };
    BIND.desk = () => { if ($('#dk')) $('#dk').onchange = e => { S.dk = e.target.value; S.mf = null; render() }; need('mf', async () => ({ code: S.dk, rows: await getManifest(S.dk) }), 'mf:' + S.dk, v => v && v.code === S.dk) };
    BIND.clients = () => need('clients', getClients);
    const NAV = [['', 'Home'], ['shipments', 'Shipments'], ['map', 'Map'], ['desk', 'Port desk'], ['clients', 'Clients'], ['ports', 'Ports'], ['new', 'Book'], ['database', 'Database']];
    function render() {
      const k = location.hash.replace(/^#\/?/, ''); const key = PAGES[k] ? k : 'home';
      $('#nav').innerHTML = NAV.map(([h, n]) => `<a href="#/${h}" class="${(h || 'home') === key ? 'on' : ''}">${n}</a>`).join('');
      $('#app').innerHTML = (S.err ? `<div class="wrap" style="padding-bottom:0"><div class="err">${esc(S.err)}</div></div>` : '') + PAGES[key]();
      (BIND[key] || (() => { }))();
      $('#foot').innerHTML = `<span class="dot" style="background:${sb ? 'var(--ok)' : 'var(--warn)'}"></span>${sb ? 'Supabase connected' : 'Demo mode'} · FX ${S.fx} · Weather ${S.wxLive ? 'live' : 'estimated'}`;
    }
    addEventListener('hashchange', () => { render(); scrollTo(0, 0) });
    (async function init() {
      $('#cur').innerHTML = Object.keys(RATES0).map(c => `<option>${c}</option>`).join('');
      $('#cur').onchange = e => { S.cur = e.target.value; logSql('Currency change', `-- client-side conversion\nselect tracking_code, base_cost_usd * ${S.rates[S.cur]} as cost_${S.cur.toLowerCase()} from shipments;`); render() };
      await load(); render(); loadFx(); loadWeather();
    })();
  </script>
</body>

</html>

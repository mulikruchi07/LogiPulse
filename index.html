<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LogiPulse — Global Freight Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0 !important
    }

    :root {
      --bg: #f4f1e9;
      --card: #fbfaf6;
      --ink: #15161c;
      --mut: #6b6d78;
      --rule: #d6d0c0;
      --ac: #2d3cb5;
      --ac2: #0f7b86;
      --ok: #2f7d4f;
      --warn: #b7791f;
      --bad: #b3322d
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 Inter, system-ui, sans-serif
    }

    h1,
    h2,
    h3 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      letter-spacing: -.015em;
      margin: 0
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.08
    }

    h2 {
      font-size: 1.6rem
    }

    h3 {
      font-size: 1.15rem
    }

    .mono,
    pre,
    td.m {
      font-family: 'IBM Plex Mono', ui-monospace, monospace
    }

    a {
      color: inherit
    }

    .mut {
      color: var(--mut)
    }

    .kick {
      font: 500 11px 'IBM Plex Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ac);
      margin-bottom: .6rem
    }

    header.top {
      border-bottom: 1.5px solid var(--ink);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5
    }

    .mast {
      max-width: 1120px;
      margin: 0 auto;
      padding: .9rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.75rem;
      align-items: center
    }

    .brand {
      font: 600 1.35rem Fraunces, Georgia, serif;
      text-decoration: none;
      margin-right: auto
    }

    .brand small {
      font: 400 .8rem Inter;
      color: var(--mut);
      margin-left: .5rem
    }

    nav {
      display: flex;
      gap: 1.4rem;
      flex-wrap: wrap
    }

    nav a {
      text-decoration: none;
      font-size: .85rem;
      padding: .2rem 0;
      border-bottom: 2px solid transparent
    }

    nav a:hover,
    nav a.on {
      border-color: var(--ac)
    }

    select,
    input,
    textarea {
      font: inherit;
      font-size: .85rem;
      background: var(--card);
      border: 1px solid var(--ink);
      padding: .5rem .65rem;
      color: var(--ink);
      width: 100%
    }

    select#cur {
      width: auto
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--ac);
      outline-offset: 1px
    }

    label {
      display: block;
      font-size: .72rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: .9rem 0 .3rem
    }

    .btn {
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      padding: .6rem 1.1rem;
      font: 500 .85rem Inter;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: .15s
    }

    .btn:hover {
      background: var(--ac);
      border-color: var(--ac)
    }

    .btn.o {
      background: transparent;
      color: var(--ink)
    }

    .btn.o:hover {
      background: var(--ink);
      color: var(--bg)
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem
    }

    .rule {
      border: 0;
      border-top: 1px solid var(--ink);
      margin: 2.5rem 0 1.5rem
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--rule);
      margin: 2.2rem 0
    }

    .stats div {
      padding: 1rem 1rem 1rem 0
    }

    .stats b {
      display: block;
      font: 500 2rem Fraunces, serif
    }

    .stats span {
      font-size: .75rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem
    }

    .g3 p {
      margin: .4rem 0 0;
      color: var(--mut);
      font-size: .92rem
    }

    .num {
      font: 500 .8rem 'IBM Plex Mono';
      color: var(--ac)
    }

    .cols {
      display: grid;
      grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
      gap: 2rem;
      align-items: start
    }

    @media(max-width:820px) {
      .cols {
        grid-template-columns: 1fr !important
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem
    }

    th {
      text-align: left;
      font: 500 10.5px 'IBM Plex Mono';
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--mut);
      padding: .5rem .6rem;
      border-bottom: 1.5px solid var(--ink)
    }

    td {
      padding: .6rem;
      border-bottom: 1px solid var(--rule)
    }

    tr.row {
      cursor: pointer
    }

    tr.row:hover td {
      background: #ece8db
    }

    tr.row.sel td {
      background: #e4e6f7
    }

    .tag {
      font: 500 10.5px 'IBM Plex Mono';
      text-transform: uppercase;
      letter-spacing: .06em;
      border: 1px solid currentColor;
      padding: .1rem .4rem;
      white-space: nowrap
    }

    .s0 {
      color: var(--ac2)
    }

    .s1 {
      color: var(--warn)
    }

    .s2 {
      color: var(--ok)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--ink);
      padding: 1.25rem
    }

    .scroll {
      overflow-x: auto
    }

    .tl {
      display: flex;
      min-width: 480px;
      margin: 1.6rem 0 1rem
    }

    .step {
      flex: 1;
      position: relative;
      text-align: center;
      font-size: 11px;
      color: var(--mut)
    }

    .step i {
      display: block;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--ink);
      background: var(--bg);
      margin: 0 auto 8px;
      position: relative;
      z-index: 1
    }

    .step:not(:last-child):after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      width: 100%;
      height: 1.5px;
      background: var(--rule)
    }

    .step.done:not(:last-child):after {
      background: var(--ink)
    }

    .step.done i {
      background: var(--ink)
    }

    .step.cur i {
      background: var(--ac);
      border-color: var(--ac);
      animation: p 1.6s infinite
    }

    .step.cur {
      color: var(--ink);
      font-weight: 600
    }

    @keyframes p {
      0% {
        box-shadow: 0 0 0 0 #2d3cb566
      }

      100% {
        box-shadow: 0 0 0 10px #2d3cb500
      }
    }

    .bar {
      height: 6px;
      background: var(--rule)
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac);
      transition: width .6s
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem
    }

    .ports {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      border-top: 1.5px solid var(--ink);
      border-left: 1px solid var(--rule)
    }

    .port {
      padding: 1.1rem;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      transition: .2s
    }

    .port:hover {
      background: var(--card)
    }

    .port b {
      font: 500 2rem Fraunces, serif;
      display: block
    }

    .err {
      color: var(--bad);
      font-size: .78rem;
      margin-top: .35rem
    }

    pre {
      background: var(--card);
      border: 1px solid var(--ink);
      padding: 1rem;
      font-size: 12px;
      line-height: 1.55;
      overflow-x: auto;
      margin: .5rem 0 1rem
    }

    .k {
      color: #2d3cb5
    }

    .s {
      color: #0f7b86
    }

    .c {
      color: #8a8c96
    }

    .n {
      color: #b7791f
    }

    .f {
      color: #8a3fb5
    }

    .tabs {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin: 1.2rem 0
    }

    .tabs button {
      background: none;
      border: 1px solid var(--ink);
      padding: .4rem .8rem;
      font: inherit;
      font-size: .8rem;
      cursor: pointer;
      color: var(--ink)
    }

    .tabs button.on {
      background: var(--ink);
      color: var(--bg)
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px
    }

    .fade {
      animation: f .35s both
    }

    @keyframes f {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1
      }
    }

    footer {
      border-top: 1.5px solid var(--ink);
      padding: 1.2rem;
      text-align: center;
      font-size: .75rem;
      color: var(--mut)
    }

    /* ===== Responsive layer ===== */
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth
    }

    img,
    svg {
      max-width: 100%
    }

    td,
    th {
      overflow-wrap: anywhere
    }

    td.m {
      overflow-wrap: normal;
      word-break: break-all
    }

    .mast,
    .wrap {
      padding-left: max(1.25rem, env(safe-area-inset-left));
      padding-right: max(1.25rem, env(safe-area-inset-right))
    }

    footer {
      padding-bottom: max(1.2rem, env(safe-area-inset-bottom))
    }

    .grid2 {
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr))
    }

    .ports {
      grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr))
    }

    .card {
      scroll-margin-top: 90px
    }

    h2 {
      font-size: clamp(1.3rem, 3vw, 1.6rem)
    }

    /* large desktops & ultrawide */
    @media(min-width:1600px) {
      html {
        font-size: 17px
      }

      .mast,
      .wrap {
        max-width: 1360px
      }
    }

    @media(min-width:2200px) {
      html {
        font-size: 20px
      }

      .mast,
      .wrap {
        max-width: 1680px
      }
    }

    /* tablets & large phones */
    @media(max-width:1024px) {
      .wrap {
        padding-top: 2rem
      }

      .cols {
        gap: 1.5rem
      }
    }

    @media(max-width:700px) {
      .mast {
        gap: .6rem 1rem;
        padding-top: .7rem;
        padding-bottom: .7rem
      }

      nav {
        order: 3;
        width: 100%;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 1.3rem;
        border-top: 1px solid var(--rule);
        padding-top: .3rem;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch
      }

      nav::-webkit-scrollbar {
        display: none
      }

      nav a {
        white-space: nowrap;
        padding: .45rem 0
      }

      .wrap {
        padding-top: 1.6rem;
        padding-bottom: 3rem
      }

      .stats b {
        font-size: 1.6rem
      }

      td,
      th {
        padding: .5rem .4rem
      }
    }

    /* vertical timeline on phones */
    @media(max-width:600px) {
      .tl {
        flex-direction: column;
        min-width: 0;
        margin: 1.2rem 0
      }

      .step {
        display: flex;
        align-items: flex-start;
        text-align: left;
        min-height: 42px;
        font-size: 13px
      }

      .step i {
        margin: 0 .75rem 0 0;
        flex: none
      }

      .step:not(:last-child):after {
        left: 7px;
        top: 16px;
        width: 1.5px;
        height: calc(100% - 16px)
      }
    }

    /* small phones */
    @media(max-width:480px) {
      .brand small {
        display: none
      }

      .stats {
        grid-template-columns: 1fr 1fr
      }

      .card {
        padding: 1rem
      }

      h1 {
        font-size: 2rem
      }

      .tabs button {
        flex: 1 1 auto
      }

      .btn {
        width: 100%;
        text-align: center;
        margin-bottom: .5rem
      }
    }

    @media(max-width:340px) {

      .mast,
      .wrap {
        padding-left: .8rem;
        padding-right: .8rem
      }

      .stats b {
        font-size: 1.35rem
      }

      nav {
        gap: .9rem
      }
    }

    /* touch devices: bigger targets, no iOS zoom-on-focus, no sticky hover */
    @media(pointer:coarse) {

      .btn,
      select,
      input,
      textarea,
      .tabs button {
        min-height: 44px
      }

      input,
      select,
      textarea {
        font-size: 16px
      }

      nav a {
        min-height: 44px;
        display: inline-flex;
        align-items: center
      }
    }

    @media(hover:none) {
      tr.row:hover td {
        background: none
      }

      .port:hover {
        background: none
      }

      .btn:hover {
        background: var(--ink);
        border-color: var(--ink)
      }

      .btn.o:hover {
        background: transparent;
        color: var(--ink)
      }
    }

    /* landscape phones: reclaim vertical space */
    @media(max-height:480px) and (orientation:landscape) {
      header.top {
        position: static
      }

      .wrap {
        padding-top: 1.2rem
      }
    }

    /* accessibility & print */
    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    @media print {

      header.top,
      footer,
      .tabs,
      .btn,
      nav {
        display: none
      }

      body {
        background: #fff
      }

      .card {
        border-color: #999
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="mast">
      <a class="brand" href="#/">LogiPulse<small>Global Freight Engine</small></a>
      <nav id="nav"></nav>
      <select id="cur" aria-label="Currency"></select>
    </div>
  </header>
  <div id="app"></div>
  <footer id="foot"></footer>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    /* ===== Database access: every request goes to /api/* (Vercel functions). No keys exist in this file or in the browser. ===== */
    try { localStorage.removeItem('lp_cfg') } catch (e) { }   // wipes any key saved by the old Connect tab
    let sb = null, _t = 0, _p = null;
    const TBL = { ports: 'ports', shipments: 'shipments', shipment_legs: 'legs', cargo_items: 'cargo' };
    const API = {
      snap() { if (Date.now() - _t > 1500) { _t = Date.now(); _p = fetch('/api/data').then(async r => { if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error(j.error || 'API error ' + r.status); e.status = r.status; throw e } return r.json() }) } return _p },
      from(t) { const q = { select: () => q, order: () => q, then: (ok, no) => API.snap().then(d => ({ data: d[TBL[t]], error: null })).then(ok, no) }; return q },
      async rpc(fn, args) { try { const r = await fetch('/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn, args }) }); const j = await r.json().catch(() => ({})); return r.ok ? { data: j.data, error: null } : { data: null, error: { message: j.error || 'Request failed' } } } catch (e) { return { data: null, error: { message: e.message } } } }
    };

    /* ===== State & helpers ===== */
    const RATES0 = { USD: 1, EUR: .92, INR: 83.4, GBP: .79, JPY: 151.2 };
    const CATS = { General: .0009, Electronics: .0014, Chemicals: .0022, Perishables: .0018, Machinery: .0012 };
    const STAGES = ['Departure', 'Customs', 'Sea transit', 'Transit hub', 'Delivery'];
    const S = { ports: [], ships: [], cur: 'USD', rates: { ...RATES0 }, fx: 'fallback', weather: {}, wxLive: false, sel: null, f: 'All', q: '', tab: 'schema', qOut: '', qSql: '', rad: 500, log: [], err: '' };
    const fmt = u => new Intl.NumberFormat('en-US', { style: 'currency', currency: S.cur, maximumFractionDigits: ['JPY', 'INR'].includes(S.cur) ? 0 : 2 }).format(u * S.rates[S.cur]);
    const hav = (a, b, c, d) => { const t = x => x * Math.PI / 180, R = 6371, h = Math.sin(t(c - a) / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(t(d - b) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)) };
    const port = c => S.ports.find(p => p.port_code === c) || { name: c, lat: 0, lon: 0 };
    const dist = (o, d) => Math.round(hav(port(o).lat, port(o).lon, port(d).lat, port(d).lon));
    const sc = s => s === 'In Transit' ? 's0' : s === 'Customs Hold' ? 's1' : 's2';
    const logSql = (label, sql) => { S.log.unshift({ t: new Date().toLocaleTimeString(), label, sql, src: sb ? 'supabase' : 'demo' }); S.log = S.log.slice(0, 30) };
    const KW = 'CREATE|TABLE|PRIMARY|KEY|REFERENCES|NOT|NULL|DEFAULT|UNIQUE|CHECK|INDEX|USING|GIST|GIN|ON|SELECT|FROM|JOIN|WHERE|AND|GROUP|BY|ORDER|INSERT|INTO|VALUES|UPDATE|SET|FUNCTION|RETURNS|TRIGGER|AFTER|FOR|EACH|ROW|EXECUTE|BEGIN|END|RETURN|LANGUAGE|OVER|DESC|AS|COALESCE|SUM|AVG|COUNT|RANK|ILIKE|IN|IS|TRUE|ENABLE|POLICY|TO|CASCADE|DECLARE|IF|THEN|ELSE';
    const HRE = new RegExp(`(--[^\\n]*)|('[^']*')|\\b(${KW})\\b|\\b(ST_\\w+)\\b|\\b(\\d+(?:\\.\\d+)?)\\b`, 'gi');
    const hl = q => esc(q).replace(HRE, (m, c, s, k, f, n) => c ? `<span class="c">${c}</span>` : s ? `<span class="s">${s}</span>` : k ? `<span class="k">${k}</span>` : f ? `<span class="f">${f}</span>` : `<span class="n">${n}</span>`);

    /* ===== Data layer (Supabase or demo) ===== */
    const P0 = [['SHA', 'Shanghai', 'CN', 31.23, 121.47], ['RTM', 'Rotterdam', 'NL', 51.95, 4.14], ['BOM', 'Mumbai (Nhava Sheva)', 'IN', 18.95, 72.95], ['HAM', 'Hamburg', 'DE', 53.54, 9.97], ['LAX', 'Los Angeles', 'US', 33.74, -118.26], ['YOK', 'Yokohama', 'JP', 35.45, 139.65], ['SIN', 'Singapore', 'SG', 1.26, 103.84], ['DXB', 'Jebel Ali (Dubai)', 'AE', 25.01, 55.06], ['ANR', 'Antwerp', 'BE', 51.26, 4.4], ['CMB', 'Colombo', 'LK', 6.95, 79.85]];
    function mkShip(id, o, d, status, stage, pos, sender, receiver, base, meta, cargo) {
      const w = cargo.reduce((a, c) => a + c.weight_kg, 0);
      return { id, tracking_code: `LP-${o}-${d}-${String(id).padStart(3, '0')}`, sender, receiver, status, stage, base_cost_usd: base, metadata_jsonb: meta, cur_lat: pos[0], cur_lon: pos[1], o, d, distance_km: dist(o, d), cargo, total_weight_kg: w, total_duty_usd: cargo.reduce((a, c) => a + c.declared_value * .06, 0) }
    }
    function loadDemo() {
      S.ports = P0.map((p, i) => ({ id: i + 1, port_code: p[0], name: p[1], country: p[2], lat: p[3], lon: p[4] }));
      S.ships = [
        mkShip(4, 'SIN', 'DXB', 'Delivered', 4, [25.01, 55.06], 'Lion City Foods', 'Gulf Fresh LLC', 3200, { hazardous: false, reefer: true, incoterm: 'CFR' }, [{ hs_code: '0803.90', weight_kg: 9800, declared_value: 41000 }]),
        mkShip(3, 'LAX', 'YOK', 'In Transit', 2, [33.5, -150.2], 'Pacific Machinery Inc', 'Kanto Industrial KK', 6900, { hazardous: false, incoterm: 'DAP' }, [{ hs_code: '8429.52', weight_kg: 23800, declared_value: 540000 }]),
        mkShip(2, 'BOM', 'HAM', 'Customs Hold', 1, [18.95, 72.95], 'Gujarat Chemicals Pvt', 'Hanse Chemie GmbH', 7600, { hazardous: true, un_number: 'UN1170', incoterm: 'FOB' }, [{ hs_code: '2207.10', weight_kg: 17200, declared_value: 96000 }]),
        mkShip(1, 'SHA', 'RTM', 'In Transit', 2, [6.9, 79.8], 'Zhejiang Electronics Co', 'Benelux Distribution BV', 9850, { hazardous: false, incoterm: 'CIF' }, [{ hs_code: '8517.12', weight_kg: 12400, declared_value: 310000 }, { hs_code: '8528.72', weight_kg: 9000, declared_value: 184000 }])];
      if (!S.ships.find(x => x.id === S.sel)) S.sel = 1;
    }
    async function load() {
      if (!sb) { try { await API.snap(); sb = API } catch (e) { if (e.status && e.status !== 404) S.err = 'Database error: ' + e.message + ' — showing demo data.'; loadDemo(); return } }
      try {
        const [p, sh, lg, cg] = await Promise.all([sb.from('ports').select('*').order('port_code'), sb.from('shipments').select('*').order('id', { ascending: false }), sb.from('shipment_legs').select('*').order('leg_order'), sb.from('cargo_items').select('*')]);

  <div><h2 style="margin-bottom:.8rem">Field notes</h2><p class="mut" style="margin:0">Weather at the departure and arrival ports is the quiet driver of most delays. We read wind, rain and storm codes for every port and turn them into a single delay-risk percentage you can see at a glance.</p></div></div>

    const DDL = `create table ports (id serial primary key, port_code char(3) unique not null,

  location geography(Point,4326));            -- GIST indexed
create table shipments (id bigint primary key, tracking_code text unique not null,

  stage smallint, total_weight_kg numeric, total_duty_usd numeric,
  metadata_jsonb jsonb default '{}');          -- GIN indexed
create table shipment_legs (id bigint primary key,

  origin_port_id int references ports(id), dest_port_id int references ports(id),

create table cargo_items (id bigint primary key,

begin
  update shipments s set
    total_weight_kg = coalesce((select sum(c.weight_kg) from cargo_items c
       join shipment_legs l on l.id = c.leg_id where l.shipment_id = s.id), 0),
    total_duty_usd  = coalesce((select sum(c.declared_value * c.duty_rate) ...), 0)
  where s.id = (select shipment_id from shipment_legs where id = new.leg_id);
  return null;
end $$ language plpgsql;

create trigger trg_cargo_totals after insert or update or delete
  on cargo_items for each row execute function recalc_shipment_totals();`;

    /* ===== Analytics ===== */

        }
        S.qOut = tbl(head, rows); logSql('Analytics · ' + k, S.qSql);

    /* ===== Events ===== */

    const NAV = [['', 'Home'], ['shipments', 'Shipments'], ['ports', 'Ports'], ['new', 'New shipment'], ['database', 'Database']];

      await load(); render(); loadFx(); loadWeather();
